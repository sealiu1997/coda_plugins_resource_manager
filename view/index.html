<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>资源管理器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bar" class="bar" hidden></div>
  <main id="stage">
    <div id="browse" class="pane browse">
      <div id="searchbar" class="searchbar" role="search"></div>
      <div id="panes">
        <div id="tree" class="pane tree" role="tree"></div>
        <div id="grid" class="pane grid"></div>
        <div id="search" class="pane search"></div>
      </div>
    </div>
    <div id="preview" class="pane preview" tabindex="-1"></div>
    <div id="notice" class="pane empty secondary"></div>
    <div id="info" class="pane preview info"></div>
  </main>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="submenu" class="menu" role="menu" hidden></div>
  <div id="hint" class="hint" role="status" hidden></div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
