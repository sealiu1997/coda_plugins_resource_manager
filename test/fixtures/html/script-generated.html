<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>脚本生成的页面</title>
<script>/* 统计脚本，预览里不执行 */ window.dataLayer = [];</script>
</head>
<body>
<div id="app"></div>
<script>
  // 页面内容全由脚本生成；预览里不执行，所以几乎是空的
  document.getElementById('app').innerHTML = '<h1>真正的内容</h1><p>这些文字只有脚本运行时才会出现，预览里不应看到。</p>';
</script>
<noscript>请启用 JavaScript</noscript>
</body>
</html>
