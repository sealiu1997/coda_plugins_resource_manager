<h1>跨节点的句子</h1>
<p>下面每一句都被拆在多个节点里，查找、选中、复制都应当把它当成一句话（具体的查找词见 README）。</p>
<p>句子一：这是一个<b>跨越</b>多个<em>节点</em>的<a href="https://example.com/s">句子</a>。</p>
<p>句子二：行内<code>代码</code>和<kbd>按键</kbd>混在<mark>一句</mark>话里。</p>
<p>句子三：被<br>换行<br>拆开的一句，复制出来应在两处断行。</p>
<p>句子四：<span>相邻</span><span>的</span><span>几个</span><span>行内元素</span>。</p>
<table><tr><td>表格第一格的前半</td><td>后半在第二格</td></tr></table>
<p>选中上面几句，复制出来的文字应是连续的一句，没有多出的换行或空格。</p>
